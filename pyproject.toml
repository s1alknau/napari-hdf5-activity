[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-hdf5-activity"
version = "0.2.0"
description = "HDF5 Activity Analysis Plugin for Napari"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "s1alknau", email = "akknauss@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: napari",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "napari>=0.5.0",
    "qtpy>=2.0.0",
    "opencv-python>=4.5.0",
    "h5py>=3.0.0",
    "matplotlib>=3.5.0",
    "psutil>=5.8.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
pyqt5 = ["napari[pyqt5]"]
pyqt6 = ["napari[pyqt6]"]
pyside6 = ["napari[pyside6]"]
# Recordings from the current rig are Zarr *format v3*. zarr-python 2.x
# reads v2 only; 3.x reads both. 3.x needs Python 3.11+, so older
# interpreters stay on 2.x and can read v2 stores only.
zarr = [
    "zarr>=3; python_version >= '3.11'",
    "zarr>=2.12.0; python_version < '3.11'",
]
testing = [
    "tox",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "napari[pyqt5]",
    "zarr>=2.12.0",
]

[project.entry-points."napari.manifest"]
napari-hdf5-activity = "napari_hdf5_activity:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]
include = ["napari_hdf5_activity*"]

[tool.setuptools.package-data]
napari_hdf5_activity = ["napari.yaml"]
