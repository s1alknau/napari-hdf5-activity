[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-hdf5-activity"
version = "0.2.0"
description = "HDF5 Activity Analysis Plugin for Napari"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "s1alknau", email = "akknauss@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: napari",
    # Must stay in sync with requires-python above. 3.9-3.11 were listed here
    # while requires-python already demanded >= 3.12, which made pip resolve
    # against a version range the package cannot actually be installed into.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "napari>=0.5.0",
    "qtpy>=2.0.0",
    "opencv-python>=4.5.0",
    "h5py>=3.0.0",
    "matplotlib>=3.5.0",
    "psutil>=5.8.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
pyqt5 = ["napari[pyqt5]"]
pyqt6 = ["napari[pyqt6]"]
pyside6 = ["napari[pyside6]"]
# Recordings from the current rig are Zarr *format v3*. zarr-python 2.x
# reads v2 only; 3.x reads both. Since requires-python is >= 3.12 the old
# marker for interpreters below 3.11 could never apply, so 3.x is simply
# required. Verified against zarr 3.3.0.
zarr = [
    "zarr>=3",
]
# The rig runs PySide6; PyQt5 was removed there on purpose and reinstalling it
# alongside PySide6 breaks napari. The testing extra therefore pulls the same
# backend the plugin is actually developed and run against. Use the pyqt5 /
# pyqt6 extras above to test a different binding deliberately.
testing = [
    "tox",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "napari[pyside6]",
    "zarr>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The rig environment also carries ImSwitch, and ImSwitch pulls in
# arkitekt-next, which registers a pytest plugin. That plugin imports
# arkitekt_next at startup, and arkitekt-next 0.30.1 asks rekuest-next for a
# symbol newer releases no longer export:
#
#   ImportError: cannot import name 'abreakpoint' from 'rekuest_next.actors.context'
#
# pytest loads entry-point plugins before collecting anything, so the whole
# run died before a single test of this package was reached. arkitekt is
# unrelated to the analysis plugin, so the plugin is simply not loaded.
# (arkitekt-next pins rekuest-next only from below, >= 0.18.2, which is why
# an unrelated upgrade in the environment can break it at any time.)
addopts = "-p no:arkitekt_next"

[project.entry-points."napari.manifest"]
napari-hdf5-activity = "napari_hdf5_activity:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]
include = ["napari_hdf5_activity*"]

[tool.setuptools.package-data]
napari_hdf5_activity = ["napari.yaml"]
