# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
# Keep in sync with requires-python in pyproject.toml (>= 3.12)
envlist = py{312,313}-{linux,macos,windows}
isolated_build=true

[gh-actions]
python =
    3.12: py312
    3.13: py313

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
extras =
    testing
commands = pytest -v --color=yes --cov=napari_hdf5_activity --cov-report=xml
